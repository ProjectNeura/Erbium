services:
  SERVICE_NAME:
    image: nvidia/cuda:13.0.0-devel-ubuntu24.04
    hostname: erbium
    container_name: erbium
    networks: [labnet]
    volumes:
      - erbium_app:/workspace/app
      - erbium_venv:/workspace/venv
      - erbium_pvenvs:/workspace/pvenvs
      - erbium_codex:/home/access/.codex
      - erbium_claude:/home/access/.claude
      - ./motd:/etc/motd:ro
      - ./venv.sh:/etc/profile.d/venv.sh:ro
      # ERBIUM_BACKUP_SECTION_START
      - ./backup-output.sh:/workspace/backup-output.sh:ro
      # ERBIUM_BACKUP_SECTION_END
      - ./skills:/opt/erbium-skills:ro
      - S:/erbium_input:/workspace/input:ro
      - S:/erbium_output:/workspace/output
      # ERBIUM_BACKUP_SECTION_START
      - S:/erbium_backup:/workspace/backup
      # ERBIUM_BACKUP_SECTION_END
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # ERBIUM_BACKUP_SECTION_START
      BORG_REPO: /workspace/backup
      # ERBIUM_BACKUP_SECTION_END
    command: >
      bash -lc '
              set -e
              apt-get update && apt-get upgrade -y && apt-get autoremove -y
              DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl unzip zip wget git gnupg openssh-server python3.12 python3.12-venv tmux vim borgbackup nodejs npm bubblewrap
              (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) && sudo mkdir -p -m 755 /etc/apt/keyrings && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg && sudo mkdir -p -m 755 /etc/apt/sources.list.d && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y
              npm i -g @openai/codex @anthropic-ai/claude-code
              npm update -g @openai/codex @anthropic-ai/claude-code
              mkdir -p /var/run/sshd
              id -u access >/dev/null 2>&1 || useradd -m -s /bin/bash access
              echo "access:sshpassword" | chpasswd
              cp -a /etc/skel/. /home/access/
              groupadd -f video
              groupadd -f render
              usermod -aG video,render access || true
              chown access:access /home/access /workspace/app /workspace/output /workspace/venv /workspace/pvenvs
              chown -R access:access /home/access/.codex /home/access/.claude
              su - access -c "mkdir -p ~/.claude/skills/use-erbium ~/.codex/skills/use-erbium"
              su - access -c "ln -sfn /opt/erbium-skills/use-erbium/SKILL.md ~/.claude/skills/use-erbium/SKILL.md"
              su - access -c "ln -sfn /opt/erbium-skills/use-erbium/SKILL.md ~/.codex/skills/use-erbium/SKILL.md"
              su - access -c "curl -LsSf https://astral.sh/uv/install.sh | sh"
              if [ ! -x /workspace/venv/bin/python ] || ! su - access -c "/workspace/venv/bin/python -c \"import sys\"" >/dev/null 2>&1; then
                rm -rf /workspace/venv/* /workspace/venv/.[!.]* /workspace/venv/..?*
                su - access -c "uv venv --python python3.12 /workspace/venv"
              fi
              if [ ! -x /workspace/venv/bin/jupyter ] || ! su - access -c "/workspace/venv/bin/python -c \"import erbium, torch, torchvision, jupyterlab, jupyter_server\"" >/dev/null 2>&1; then
                su - access -c "uv pip install --python /workspace/venv/bin/python --upgrade torch torchvision jupyterlab jupyter-archive git+https://github.com/ProjectNeura/Erbium"
              fi
              # ERBIUM_BACKUP_SECTION_START
              chown root:root /workspace/backup
              chmod 700 /workspace/backup
              if [ ! -f /workspace/backup/config ]; then
                borg init --encryption=none /workspace/backup
              fi
              (
                while true; do
                /workspace/backup-output.sh || true
                sleep 43200
                done
              ) &
              # ERBIUM_BACKUP_SECTION_END
              echo "PermitRootLogin no" >> /etc/ssh/sshd_config
              echo "PubkeyAuthentication no" >> /etc/ssh/sshd_config
              echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
              echo "AllowUsers access" >> /etc/ssh/sshd_config
              /usr/sbin/sshd
              su - access -c "/workspace/venv/bin/jupyter lab --no-browser --port=8080 --ip=0.0.0.0 --ServerApp.root_dir=/workspace --ServerApp.trust_xheaders=True --ServerApp.allow_remote_access=True" &
              /workspace/venv/bin/python -m erbium server run -p 8000
            '
    restart: no
networks:
  labnet:
    external: true
volumes:
  erbium_app:
  erbium_venv:
  erbium_pvenvs:
  erbium_codex:
  erbium_claude:
