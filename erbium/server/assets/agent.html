<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ProjectNeura/ProjectNeura/5ea0c73a40ad560e179c152ff3660d03924ef6e1/img/logo.png" />
  <title>Erbium Agent Status</title>
  <style>
    :root {
      --bg: #101419;
      --panel: #171d23;
      --panel-strong: #1f2730;
      --line: #2c3742;
      --text: #edf2f7;
      --muted: #9aa8b5;
      --accent: #4fb3ff;
      --success: #57d18d;
      --warning: #f0b35a;
      --danger: #ff7a62;
      --code: #070a0d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--success));
      flex: 0 0 auto;
    }

    .brand strong {
      display: block;
      font-size: 0.98rem;
    }

    .brand span,
    .nav,
    .label,
    .meta,
    .empty {
      color: var(--muted);
    }

    .brand span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      font-size: 0.88rem;
    }

    .nav a {
      padding: 6px 0;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 28px 0 18px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4.6rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 10px;
      font-size: 0.96rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 108px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .status-pill.running {
      border-color: rgba(79, 179, 255, 0.45);
      color: var(--accent);
    }

    .status-pill.finished {
      border-color: rgba(87, 209, 141, 0.45);
      color: var(--success);
    }

    .status-pill.failed {
      border-color: rgba(255, 122, 98, 0.5);
      color: var(--danger);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric,
    .output-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric {
      min-height: 92px;
      padding: 14px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 1rem;
      font-weight: 650;
    }

    .output-panel {
      overflow: hidden;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .output-header strong {
      font-size: 0.95rem;
    }

    pre {
      margin: 0;
      min-height: 52vh;
      max-height: 62vh;
      overflow: auto;
      padding: 14px;
      background: var(--code);
      color: #d7e2ec;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 0.88rem/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 1080px);
        padding-top: 10px;
      }

      .topbar,
      .hero {
        align-items: start;
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .nav {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      pre {
        min-height: 58vh;
        max-height: 64vh;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/dash">
        <span class="mark" aria-hidden="true"></span>
        <span>
          <strong>Erbium</strong>
          <span>Agent status dashboard</span>
        </span>
      </a>
      <nav class="nav" aria-label="Dashboards">
        <a href="/codex">Codex</a>
        <a href="/claude">Claude</a>
        <a href="/dash">Scheduler</a>
      </nav>
    </header>

    <section class="hero">
      <div>
        <h1 id="agentTitle">Agent</h1>
        <p class="meta" id="taskLine">Waiting for status...</p>
      </div>
      <span class="status-pill" id="statePill">Idle</span>
    </section>

    <section class="grid" aria-label="Agent metrics">
      <article class="metric">
        <div class="label">Started</div>
        <div class="value" id="startedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Updated</div>
        <div class="value" id="updatedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Finished</div>
        <div class="value" id="finishedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Exit code</div>
        <div class="value" id="exitCode">--</div>
      </article>
    </section>

    <section class="output-panel" aria-labelledby="outputHeading">
      <div class="output-header">
        <strong id="outputHeading">Latest output</strong>
        <span class="meta" id="outputSize">0 chars</span>
      </div>
      <pre id="latestOutput"><span class="empty">No output captured yet.</span></pre>
    </section>
  </main>

  <script>
    const agent = (location.pathname.replace(/^\/+/, "").split("/")[0] || "codex").toLowerCase();
    const els = {
      agentTitle: document.getElementById("agentTitle"),
      taskLine: document.getElementById("taskLine"),
      statePill: document.getElementById("statePill"),
      startedAt: document.getElementById("startedAt"),
      updatedAt: document.getElementById("updatedAt"),
      finishedAt: document.getElementById("finishedAt"),
      exitCode: document.getElementById("exitCode"),
      latestOutput: document.getElementById("latestOutput"),
      outputSize: document.getElementById("outputSize")
    };

    function formatTime(value) {
      if (!Number.isFinite(Number(value))) {
        return "--";
      }
      return new Date(Number(value) * 1000).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function render(payload) {
      const state = payload.state || "idle";
      const output = payload.latest_output || "";

      document.title = `${payload.display_name || agent} - Erbium`;
      els.agentTitle.textContent = payload.display_name || agent;
      els.taskLine.textContent = payload.task || "No task has been recorded yet.";
      els.statePill.textContent = state;
      els.statePill.className = `status-pill ${state}`;
      els.startedAt.textContent = formatTime(payload.started_at);
      els.updatedAt.textContent = formatTime(payload.updated_at);
      els.finishedAt.textContent = formatTime(payload.finished_at);
      els.exitCode.textContent = payload.exit_code === null || payload.exit_code === undefined ? "--" : String(payload.exit_code);
      els.outputSize.textContent = `${output.length.toLocaleString()} chars`;

      if (output) {
        els.latestOutput.textContent = output;
        els.latestOutput.scrollTop = els.latestOutput.scrollHeight;
      } else {
        els.latestOutput.innerHTML = '<span class="empty">No output captured yet.</span>';
      }
    }

    async function refresh() {
      try {
        const response = await fetch(`/agent_status/${agent}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }
        render(await response.json());
      } catch (error) {
        els.taskLine.textContent = "Status endpoint unavailable.";
        els.statePill.textContent = "Offline";
        els.statePill.className = "status-pill failed";
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
