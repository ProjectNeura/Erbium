<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/ProjectNeura/ProjectNeura/refs/heads/master/img/logo.svg" />
  <title>Erbium Agent Status</title>
  <style>
    :root {
      --bg: #101419;
      --panel: #171d23;
      --panel-strong: #1f2730;
      --line: #2c3742;
      --text: #edf2f7;
      --muted: #9aa8b5;
      --accent: #4fb3ff;
      --success: #57d18d;
      --warning: #f0b35a;
      --danger: #ff7a62;
      --code: #070a0d;
      --selected: #223344;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--success));
      flex: 0 0 auto;
    }

    .brand strong {
      display: block;
      font-size: 0.98rem;
    }

    .brand span,
    .nav,
    .label,
    .meta,
    .empty {
      color: var(--muted);
    }

    .brand span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
      font-size: 0.88rem;
    }

    .nav a {
      padding: 6px 0;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 28px 0 18px;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4.6rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 10px;
      font-size: 0.96rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 108px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    .status-pill.running {
      border-color: rgba(79, 179, 255, 0.45);
      color: var(--accent);
    }

    .status-pill.finished {
      border-color: rgba(87, 209, 141, 0.45);
      color: var(--success);
    }

    .status-pill.failed {
      border-color: rgba(255, 122, 98, 0.5);
      color: var(--danger);
    }

    .status-pill.stale {
      border-color: rgba(240, 179, 90, 0.5);
      color: var(--warning);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric,
    .sessions-panel,
    .output-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric {
      min-height: 92px;
      padding: 14px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 1rem;
      font-weight: 650;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(240px, 0.34fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .sessions-panel {
      overflow: hidden;
    }

    .sessions-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .sessions-header strong {
      display: block;
      font-size: 0.95rem;
    }

    .sessions-list {
      display: grid;
      max-height: 62vh;
      overflow: auto;
    }

    .session-button {
      display: grid;
      gap: 6px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .session-button:hover,
    .session-button.selected {
      background: var(--selected);
    }

    .session-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .session-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.92rem;
    }

    .session-state {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .session-state.running {
      color: var(--accent);
    }

    .session-state.finished {
      color: var(--success);
    }

    .session-state.failed {
      color: var(--danger);
    }

    .session-state.stale {
      color: var(--warning);
    }

    .session-task,
    .session-time {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .output-panel {
      overflow: hidden;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .output-header strong {
      font-size: 0.95rem;
    }

    pre {
      margin: 0;
      min-height: 52vh;
      max-height: 62vh;
      overflow: auto;
      padding: 14px;
      background: var(--code);
      color: #d7e2ec;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 0.88rem/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .empty {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 20px, 1080px);
        padding-top: 10px;
      }

      .topbar,
      .hero {
        align-items: start;
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .nav {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      pre {
        min-height: 58vh;
        max-height: 64vh;
        font-size: 0.82rem;
      }

      .workbench {
        grid-template-columns: 1fr;
      }

      .sessions-list {
        max-height: 240px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/dash">
        <span class="mark" aria-hidden="true"></span>
        <span>
          <strong>Erbium</strong>
          <span>Agent status dashboard</span>
        </span>
      </a>
      <nav class="nav" aria-label="Dashboards">
        <a href="/codex">Codex</a>
        <a href="/claude">Claude</a>
        <a href="/dash">Scheduler</a>
      </nav>
    </header>

    <section class="hero">
      <div>
        <h1 id="agentTitle">Agent</h1>
        <p class="meta" id="taskLine">Waiting for status...</p>
      </div>
      <span class="status-pill" id="statePill">Idle</span>
    </section>

    <section class="grid" aria-label="Agent metrics">
      <article class="metric">
        <div class="label">Started</div>
        <div class="value" id="startedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Updated</div>
        <div class="value" id="updatedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Finished</div>
        <div class="value" id="finishedAt">--</div>
      </article>
      <article class="metric">
        <div class="label">Exit code</div>
        <div class="value" id="exitCode">--</div>
      </article>
    </section>

    <section class="workbench">
      <aside class="sessions-panel" aria-labelledby="sessionsHeading">
        <div class="sessions-header">
          <strong id="sessionsHeading">Sessions</strong>
          <span class="meta" id="sessionCount">0 recorded</span>
        </div>
        <div class="sessions-list" id="sessionsList" aria-live="polite"></div>
      </aside>

      <section class="output-panel" aria-labelledby="outputHeading">
        <div class="output-header">
          <strong id="outputHeading">Latest output</strong>
          <span class="meta" id="outputSize">0 chars</span>
        </div>
        <pre id="latestOutput"><span class="empty">No output captured yet.</span></pre>
      </section>
    </section>
  </main>

  <script>
    const agent = (location.pathname.replace(/^\/+/, "").split("/")[0] || "codex").toLowerCase();
    const state = {
      selectedSessionId: null,
      selectedWasExplicit: false
    };
    const els = {
      agentTitle: document.getElementById("agentTitle"),
      taskLine: document.getElementById("taskLine"),
      statePill: document.getElementById("statePill"),
      startedAt: document.getElementById("startedAt"),
      updatedAt: document.getElementById("updatedAt"),
      finishedAt: document.getElementById("finishedAt"),
      exitCode: document.getElementById("exitCode"),
      latestOutput: document.getElementById("latestOutput"),
      outputSize: document.getElementById("outputSize"),
      sessionsList: document.getElementById("sessionsList"),
      sessionCount: document.getElementById("sessionCount")
    };

    function formatTime(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) {
        return "--";
      }
      return new Date(Number(value) * 1000).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function formatSessionLabel(session) {
      return session.session_id || "default";
    }

    function chooseSelectedSession(sessions) {
      if (!sessions.length) {
        state.selectedSessionId = null;
        state.selectedWasExplicit = false;
        return null;
      }
      const stillExists = sessions.some((session) => session.session_id === state.selectedSessionId);
      if (state.selectedWasExplicit && stillExists) {
        return sessions.find((session) => session.session_id === state.selectedSessionId);
      }
      const running = sessions.find((session) => session.state === "running");
      const selected = running || sessions[0];
      state.selectedSessionId = selected.session_id;
      state.selectedWasExplicit = false;
      return selected;
    }

    function renderSessions(sessions) {
      els.sessionCount.textContent = `${sessions.length} recorded`;
      if (!sessions.length) {
        els.sessionsList.innerHTML = '<div class="session-button empty">No sessions have reported yet.</div>';
        return;
      }

      els.sessionsList.innerHTML = sessions.map((session) => `
        <button class="session-button ${session.session_id === state.selectedSessionId ? "selected" : ""}" type="button" data-session-id="${encodeURIComponent(session.session_id)}">
          <span class="session-title">
            <strong>${escapeHtml(formatSessionLabel(session))}</strong>
            <span class="session-state ${escapeHtml(session.state || "idle")}">${escapeHtml(session.state || "idle")}</span>
          </span>
          <span class="session-task">${escapeHtml(session.task || "No task recorded")}</span>
          <span class="session-time">Updated ${escapeHtml(formatTime(session.updated_at))}</span>
        </button>
      `).join("");

      els.sessionsList.querySelectorAll("[data-session-id]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedSessionId = decodeURIComponent(button.dataset.sessionId || "");
          state.selectedWasExplicit = true;
          refresh();
        });
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderDetail(payload, displayName) {
      const currentState = payload.state || "idle";
      const output = payload.latest_output || "";

      document.title = `${displayName || payload.display_name || agent} - Erbium`;
      els.agentTitle.textContent = displayName || payload.display_name || agent;
      els.taskLine.textContent = payload.task || "No task has been recorded yet.";
      els.statePill.textContent = currentState;
      els.statePill.className = `status-pill ${currentState}`;
      els.startedAt.textContent = formatTime(payload.started_at);
      els.updatedAt.textContent = formatTime(payload.updated_at);
      els.finishedAt.textContent = formatTime(payload.finished_at);
      els.exitCode.textContent = payload.exit_code === null || payload.exit_code === undefined ? "--" : String(payload.exit_code);
      els.outputSize.textContent = `${output.length.toLocaleString()} chars`;

      if (output) {
        els.latestOutput.textContent = output;
        els.latestOutput.scrollTop = els.latestOutput.scrollHeight;
      } else {
        els.latestOutput.innerHTML = '<span class="empty">No output captured yet.</span>';
      }
    }

    function renderEmpty(displayName) {
      document.title = `${displayName || agent} - Erbium`;
      els.agentTitle.textContent = displayName || agent;
      els.taskLine.textContent = "No task has been recorded yet.";
      els.statePill.textContent = "Idle";
      els.statePill.className = "status-pill idle";
      els.startedAt.textContent = "--";
      els.updatedAt.textContent = "--";
      els.finishedAt.textContent = "--";
      els.exitCode.textContent = "--";
      els.outputSize.textContent = "0 chars";
      els.latestOutput.innerHTML = '<span class="empty">No output captured yet.</span>';
    }

    async function refresh() {
      try {
        const response = await fetch(`/agent_status/${agent}`, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Request failed with status ${response.status}`);
        }
        const payload = await response.json();
        const sessions = Array.isArray(payload.sessions) ? payload.sessions : [];
        const selected = chooseSelectedSession(sessions);
        renderSessions(sessions);

        if (!selected) {
          renderEmpty(payload.display_name);
          return;
        }

        const detailResponse = await fetch(`/agent_status/${agent}/${encodeURIComponent(selected.session_id)}`, { cache: "no-store" });
        if (!detailResponse.ok) {
          throw new Error(`Session request failed with status ${detailResponse.status}`);
        }
        renderDetail(await detailResponse.json(), payload.display_name);
      } catch (error) {
        els.taskLine.textContent = "Status endpoint unavailable.";
        els.statePill.textContent = "Offline";
        els.statePill.className = "status-pill failed";
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
